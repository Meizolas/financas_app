name: financas_app
description: Aplicativo de Controle Financeiro Personalizado
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.19.0
  provider: ^6.1.2
  google_fonts: ^6.1.0
  fl_chart: ^0.68.0
  sqflite: ^2.3.3+1
  sqflite_common_ffi: ^2.3.3
  sqflite_common_ffi_web: ^0.4.5+4
  flutter_dotenv: ^5.1.0
  supabase_flutter: ^2.8.1
  http: ^1.2.2
  crypto: ^3.0.7
  shared_preferences: ^2.3.4
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/logo.png
    - assets/icone.png
